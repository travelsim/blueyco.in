name: Bluey active listing sweep

on:
  schedule:
    # 19:00 UTC = 06:00 AEDT, ahead of the Australian morning.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      product_ids:
        description: 'Optional comma-separated product IDs for a bounded run (blank = full catalogue)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: bluey-active-listing-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo 'DATABASE_URL Actions secret is not configured'; exit 1; }
      - name: Sweep live listings into Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLUEY_NEON_BRANCH_ID: br-damp-sun-bky4w0l6
          PRODUCT_IDS: ${{ inputs.product_ids }}
        run: |
          if [ -n "$PRODUCT_IDS" ]; then
            python db/daily_check.py https://blueyco.in --product-ids "$PRODUCT_IDS"
          else
            python db/daily_check.py https://blueyco.in
          fi
