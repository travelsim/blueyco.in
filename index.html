<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bluey Coin Tracker — Royal Australian Mint Prices & Where to Buy</title>
<meta name="description" content="Track eBay sold prices and retailer listings for Royal Australian Mint Bluey coins.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600&display=swap');

  :root {
    --blue:   #1e90d4;
    --orange: #f47e3c;
    --teal:   #2ec4b6;
    --bg:     #f0f7ff;
    --card:   #ffffff;
    --text:   #1a2e44;
    --muted:  #7a92a8;
    --border: #d8eaf8;
  }

  * { box-sizing: border-box; }
  body {
    font-family: 'Nunito Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0;
  }
  header {
    background: var(--blue);
    color: white;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.35rem; display: flex; align-items: center; gap: 8px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  h1 { font-family: 'Nunito', sans-serif; font-weight: 900; color: var(--blue); margin: 0 0 8px; }
  .subtitle { color: var(--muted); margin-bottom: 20px; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab { padding: 6px 14px; border: 1px solid var(--border); background: white; border-radius: 999px; cursor: pointer; font-size: 0.85rem; }
  .tab.active { background: var(--blue); color: white; border-color: var(--blue); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 0.9rem;
  }
  .card h3 { margin: 0 0 6px; font-size: 0.95rem; }
  .stat { font-size: 0.8rem; color: var(--muted); }
  .price { font-weight: 800; font-size: 1.05rem; }
  button {
    background: #27ae60;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    width: 100%;
    margin-top: 8px;
  }
  .footer { text-align: center; padding: 20px; font-size: 0.75rem; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="logo">🐾 Bluey Coin Tracker</div>
</header>

<main>
  <h1>Royal Australian Mint — Bluey Coins</h1>
  <p class="subtitle">eBay AU sold prices and retailer listings. Data from cached snapshots. (Vercel static)</p>

  <div class="tabs" id="tabs"></div>

  <div class="grid" id="grid"></div>
</main>

<div class="footer">
  Static site on Vercel • Update cache files to refresh data
</div>

<script>
const COINS = [
  { id: 's1_bluey', series: 'series1', name: '2024 $1 Bluey Dollarbuck – Bluey', color: '#1e90d4' },
  { id: 's1_bingo', series: 'series1', name: '2024 $1 Bluey Dollarbuck – Bingo', color: '#f47e3c' },
  { id: 's1_grannies', series: 'series1', name: '2024 $1 Bluey Dollarbuck – The Grannies', color: '#2ec4b6' },
  { id: 's1_heelers', series: 'series1', name: '2024 $1 Bluey Dollarbuck – The Heelers', color: '#e84855' },
  { id: 's1_set', series: 'series1', name: '2024 $1 Bluey Dollarbuck – 3-Coin Set', color: '#9b59b6' },
  { id: 's2_xmas_unc', series: 'series2', name: '2025 $1 Bluey Christmas – Coloured UNC', color: '#e84855' },
  { id: 's3_folder', series: 'series3', name: '2026 $2 Bluey Collection Folder', color: '#1e90d4' },
  { id: 's3_proof_ab', series: 'series3', name: '2026 $2 Bluey 2 – Coloured Proof (Al Bronze)', color: '#f47e3c' },
  { id: 's3_proof_silv', series: 'series3', name: '2026 $2 Bluey 2 – Coloured Silver Proof', color: '#8e8e93' },
  { id: 's3_rain', series: 'series3', name: '2026 $2 Bluey 2 – Privy Mark UNC – Rain', color: '#2ec4b6' },
  // Add more coins here as needed
];

let activeSeries = 'all';
let coinData = {};
let retailerData = {};

async function loadData() {
  try {
    const [cacheRes, retRes] = await Promise.all([
      fetch('/ebay_cache.json'),
      fetch('/retailer_prices.json').catch(() => ({ json: () => ({}) }))
    ]);
    coinData = await cacheRes.json();
    retailerData = await retRes.json();
    render();
  } catch (e) {
    document.getElementById('grid').innerHTML = '<p style="color:#c0392b">Failed to load cache files. Make sure ebay_cache.json and retailer_prices.json are in the repo.</p>';
  }
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const filtered = activeSeries === 'all' ? COINS : COINS.filter(c => c.series === activeSeries);

  filtered.forEach(coin => {
    const d = coinData[coin.id] || {};
    const ebay = d.ebay || {};
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <h3 style="color:${coin.color}">${coin.name}</h3>
      <div class="stat">eBay avg sold: <span class="price">${ebay.average_price ? '$' + ebay.average_price : '—'}</span></div>
      <div class="stat">Median: ${ebay.median_price ? '$' + ebay.median_price : '—'} • ${ebay.results || 0} sales</div>
      <button onclick="showBuy('${coin.id}')">Where to Buy</button>
    `;
    grid.appendChild(div);
  });
}

window.showBuy = function(coinId) {
  const data = retailerData[coinId] || {};
  let msg = 'Where to Buy (from retailer_prices.json)\n\n';
  let found = false;
  for (const [rid, info] of Object.entries(data)) {
    found = true;
    if (info.price) {
      msg += `${rid}: $${info.price} — ${info.url || ''}\n`;
    } else {
      msg += `${rid}: Search link — ${info.url || ''}\n`;
    }
  }
  if (!found) msg += 'No manual retailer prices configured yet.\nAdd entries to retailer_prices.json';
  alert(msg);
};

// Simple tabs
['all','series1','series2','series3'].forEach(s => {
  const b = document.createElement('button');
  b.className = 'tab' + (s === 'all' ? ' active' : '');
  b.textContent = s === 'all' ? 'All Series' : (s === 'series1' ? 'Series 1 · 2024' : s === 'series2' ? 'Series 2 · 2025 Christmas' : 'Series 3 · 2026');
  b.onclick = () => {
    activeSeries = s;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    b.classList.add('active');
    render();
  };
  document.getElementById('tabs').appendChild(b);
});

loadData();
</script>
</body>
</html>
