# Render Blueprint — blueycoin (blueyco.in)
# See: https://render.com/docs/blueprint-spec
# Apply via Render Dashboard → Blueprints → Connect repo travelsim/blueycoin
services:
  - type: web
    name: blueycoin
    runtime: python
    region: oregon          # closest to AU
    plan: starter           # $7/mo, can switch to free (750h/mo shared)
    buildCommand: pip install --upgrade pip  # stdlib-only, no extra deps needed
    startCommand: python server.py
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: PORT
        value: "10000"
      - key: RAPIDAPI_KEY
        sync: false          # secret — set manually in Render dashboard
      - key: EBAY_CLIENT_ID
        sync: false          # secret — eBay Developer Program app Client ID (Browse API)
      - key: EBAY_CLIENT_SECRET
        sync: false          # secret — eBay Developer Program app Client Secret (Browse API)
      - key: PYTHONUNBUFFERED
        value: "1"
